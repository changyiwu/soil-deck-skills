name: Validate soil-image-deck

on:
  push:
    paths:
      - "skills/soil-image-deck/**"
      - ".github/workflows/validate-soil-image-deck.yml"
  pull_request:
    paths:
      - "skills/soil-image-deck/**"
      - ".github/workflows/validate-soil-image-deck.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML Pillow
      - run: >-
          python skills/soil-image-deck/scripts/validate_spec.py
          --spec skills/soil-image-deck/assets/soil-spec-template.yaml
