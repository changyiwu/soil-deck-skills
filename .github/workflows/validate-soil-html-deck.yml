name: Validate soil-html-deck

on:
  push:
    paths:
      - "skills/soil-html-deck/**"
      - "skills/soil-image-deck/references/soil-deck-core.md"
      - "scripts/validate_all.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-soil-html-deck.yml"
  pull_request:
    paths:
      - "skills/soil-html-deck/**"
      - "skills/soil-image-deck/references/soil-deck-core.md"
      - "scripts/validate_all.py"
      - "requirements-dev.txt"
      - ".github/workflows/validate-soil-html-deck.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_all.py --target html
